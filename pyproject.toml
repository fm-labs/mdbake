[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdbake"
version = "0.2.1"
description = "Bake HTML sites from MarkDown"
readme = "README.md"
authors = [
    { name = "fm-labs", email = "mdbake@fmlabs.dev" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = [
    "LICEN[CS]E*",
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "linkify-it-py>=2.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "click>=8.1",
    "Pygments>=2.15",
    "livereload>=2.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
    "pytest>=9.0.2",
    "ruff>=0.15.21",
]

[project.scripts]
mdbake = "mdbake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdbake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
ignore = [
    "BLE001",
    "E402",
    "E501",
    "PERF402",
    "TRY401",
]
select = [
    "E",
]
